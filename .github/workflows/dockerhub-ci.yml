name: DockerHub CI

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Docker setup
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_TATIANA }}
          password: ${{ secrets.DOCKERHUB_TOKEN_TATIANA }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile-tatiana/Dockerfile
          push: true
          tags: 261a/webflux-nosql:latest