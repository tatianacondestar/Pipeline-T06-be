name: Trivy Security Scan

on:
  push:
    branches:
      - develop

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      - name: Build Docker image for scanning
        run: docker build -t allavamos:scan -f dockerfile-tatiana/Dockerfile .

      - name: Run Trivy - CRITICAL & HIGH (exit-code 1 si hay vulnerabilidades)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: allavamos:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run Trivy - Full Report (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: allavamos:scan
          format: table
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
